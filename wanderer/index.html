<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="apple-mobile-web-app-capable" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wanderer" />
    <title>The Wanderer</title>
    <link rel="stylesheet" href="/wanderer/wanderer.css" />
  </head>
  <body>
    <div id="world-screen" class="screen visible">
      <canvas id="world"></canvas>

      <!-- HTML overlay for crisp text + UI. Sits on top of canvas. -->
      <div id="overlay" class="overlay">
        <button id="mute-toggle" class="mute-toggle" type="button" aria-label="Toggle sound">
          <span class="mute-icon" id="mute-icon-on">&#9834;</span>
          <span class="mute-icon" id="mute-icon-off">&#216;</span>
        </button>

        <div id="picker-row" class="picker-row">
          <button class="glyph" data-state="static"   aria-label="Static">🜁</button>
          <button class="glyph" data-state="restless" aria-label="Restless">🜂</button>
          <button class="glyph" data-state="grey"     aria-label="Grey">🜃</button>
          <button class="glyph" data-state="hollow"   aria-label="Hollow">🜄</button>
          <button class="glyph" data-state="clear"    aria-label="Clear">◯</button>
        </div>
        <div id="picker-hint" class="picker-hint">tap a mark</div>

        <div id="zone-label" class="zone-label"></div>
        <div id="line" class="line"></div>
        <div id="leave-hint" class="leave-hint">tap to leave</div>
      </div>
    </div>

    <noscript>
      <div style="position:fixed;inset:0;background:#0a0a0c;color:#ebe3d3;display:flex;align-items:center;justify-content:center;font-family:ui-monospace,monospace;padding:32px;text-align:center;">
        This world needs JavaScript. Turn it on.
      </div>
    </noscript>

    <script type="module" src="/wanderer/wanderer.js"></script>
  </body>
</html>
