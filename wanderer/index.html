<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="apple-mobile-web-app-capable" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wanderer" />
    <title>The Wanderer</title>
    <link rel="stylesheet" href="/wanderer/wanderer.css" />
  </head>
  <body>
    <div id="world-screen" class="screen visible">
      <button id="mute-toggle" class="mute-toggle" type="button" aria-label="Toggle sound">
        <span class="mute-icon" id="mute-icon-on">&#9834;</span>
        <span class="mute-icon" id="mute-icon-off">&#216;</span>
      </button>
      <canvas id="world" width="640" height="360"></canvas>
    </div>

    <noscript>
      <div style="position:fixed;inset:0;background:#0a0a0c;color:#ebe3d3;display:flex;align-items:center;justify-content:center;font-family:ui-monospace,monospace;padding:32px;text-align:center;">
        This world needs JavaScript. Turn it on.
      </div>
    </noscript>

    <script type="module" src="/wanderer/wanderer.js"></script>
  </body>
</html>
